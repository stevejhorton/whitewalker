# =============================================================================
# HayStack Needle List
# Managed centrally on NETLOGON share.
# \\DSADCWPFP001A06.ms.ds.uhc.com\NETLOGON\UHG\Scripts\AOVPN\CPR
# DO NOT edit the local cached copy.
# Local copy at C:\ProgramData\WhiteWalker\needles.cfg is auto-synced by CPR.
# =============================================================================
#
# FORMAT: NEEDLE|LogName|EventID|XPathFilter|Label[|ExtendedLogging]
#
#   LogName     - Windows Event Log name (e.g. System, Application, Security,
#                 Microsoft-Windows-NetworkProfile/Operational)
#   EventID     - Numeric Event ID to trigger on
#   XPathFilter - Full XPath <Select> expression, OR empty (trailing pipe) for
#                 a bare EventID-only match. When provided, this becomes the
#                 entire <Select> body in the TS event subscription XML.
#                 IMPORTANT: Task Scheduler XPath is a restricted subset.
#                 Use EventID=N (not EventID[.='N']). No contains(). No multi-
#                 predicate EventData compounds. Keep it simple.
#   Label       - Short tag (no spaces). Used as the log tag in haystack.log
#                 and for human identification. Must be unique across all needles
#                 (both this file and needles_local.cfg).
#   ExtendedLogging (optional) - Valid values:
#                 Omit or set to 0 for normal logging (metadata only).
#                 Set to 1 to include event message body truncated to 128 chars
#                 in syslog payload as body="...".
#                 Set to all (or 2) to include full untruncated event body.
#                 Example with extended logging:
#                   NEEDLE|Application|1000||App_Crash_Any|1
#                   #NEEDLE|Application|1000||App_Crash_Any_Full|all
#
# FORMAT: SESSION|StateChange|Label
#
#   StateChange - One of: SessionLock, SessionUnlock, RemoteConnect,
#                 RemoteDisconnect, ConsoleConnect, ConsoleDisconnect
#   Label       - Short tag (no spaces). Must be unique across all needles.
#
#   SESSION entries generate a <SessionStateChangeTrigger> in the TS task
#   instead of an <EventTrigger>. There is no event log query on wake -
#   the action firing is itself the hit. Use needles_local.cfg for SESSION
#   entries during testing (e.g. SessionUnlock as a proof-of-life trigger).
#   NOTE: SESSION triggers do not support ExtendedLogging (no message body).
#
# FORMAT: DEFENDER|RuleNameMatch|IntervalHours|Label[|ExtendedLogging]
#
#   RuleNameMatch - Literal substring matched against the Name= field in each
#                   pipe-delimited firewall rule Data string under:
#                   HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\
#                   FirewallPolicy\Mdm\FirewallRules
#                   Matching is case-insensitive and separator-tolerant: both
#                   sides are lowercased and every non-alphanumeric character
#                   (spaces, - _ / . and repeated whitespace) is dropped before
#                   the substring test, so "V2 - MsWebView2 Any Out" matches a
#                   deployed rule named "V2-MsWebView2 Any Out". The value is
#                   always literal text, never a regex.
#                   Because separators are removed, a very short or generic
#                   value can collide with an unrelated rule - pick a
#                   distinctive, stable, descriptive substring of the name.
#   IntervalHours - Optional numeric re-check interval in hours. Empty/invalid
#                   values use the global default (6 hours).
#   Label         - Short tag (no spaces or \/:*?"<>|). Must be unique across
#                   both this file and needles_local.cfg.
#   ExtendedLogging (optional) - Same 0/1/2/all behavior as NEEDLE. Enabled
#                   modes add matched rule Data as body="..." (mode 1 truncates
#                   to 128 characters; 2/all include the full string).
#   DEFENDER entries are evaluated inline on each HayStack wake when their
#   per-label flag is due; they do not create Task Scheduler triggers.
#
# FORMAT: HEADER|FieldName|Label[|RefreshHours=N][|SendHours=M]
#
#   Opts a WW_main run-header field into HayStack/Tee/syslog telemetry with no
#   PowerShell edits - add a line here (or in needles_local.cfg) and it ships.
#
#   FieldName   - One known run-header field, or * for all of them bundled into
#                 a single payload sent under this Label. Known fields:
#                   ww_version   White Walker/CPR release version
#                   os           OS caption + version
#                   model        Manufacturer + model
#                   serial       BIOS serial number
#                   last_boot    Last boot time
#                   csc_version  Cisco Secure Client core version
#                   csc_source   Where that version was resolved from
#                   vpn_profile  VPN profile name, or NOT_SET
#                 An unknown/misspelled FieldName is skipped with a WARN in
#                 haystack.log - it is never silently ignored.
#   Label       - Short tag (no spaces or \/:*?"<>|). Must be unique across
#                 both this file and needles_local.cfg.
#   RefreshHours=N - Optional. How often Write-RunHeader recomputes the cached
#                 value in C:\ProgramData\WhiteWalker\header_cache.json.
#                 Default 6. When several needles name the same field, the
#                 shortest RefreshHours wins so nothing goes stale.
#   SendHours=M - Optional. How often the cached value is actually shipped to
#                 HayStack/Tee/syslog, independent of RefreshHours. Default 24.
#   Both tokens are order-flexible and may be omitted. Invalid or non-numeric
#   values fall back to the defaults above and log a WARN.
#
#   HEADER entries are evaluated inline on each HayStack wake (event, session,
#   or heartbeat); they do not create Task Scheduler triggers. Values are only
#   ever read from header_cache.json - HayStack never probes the box itself.
#   Telemetry lands as action="haystack_header_fields" with Label=,
#   header_field= and the field value(s) as key="value" pairs.
#
#   Examples:
#     HEADER|csc_version|CSC_Version|RefreshHours=6|SendHours=24
#     HEADER|*|Run_Header_All|RefreshHours=12|SendHours=24
#
# Lines starting with # are comments and are ignored.
# Blank lines are ignored.
# Version line MUST be line 1 - format: version:DDMMMYY (e.g. version:15May26)
# =============================================================================
#
# Workstation Unlock (TEST)
#NEEDLE|Security|4801||Workstation_Unlock

# --- Cisco AnyConnect / Secure Client ---
# Uses the native Cisco event log (not System/SCM) and csc_vpnagent provider.
# TS XPath requires EventID=N syntax (not EventID[.='N']) - no contains() allowed.

# Fires when AnyConnect VPN tunnel comes up (connected)
#NEEDLE|Cisco Secure Client - AnyConnect VPN|2072|*[System[Provider[@Name='csc_vpnagent'] and EventID=2072]]|AnyConnect_Connected

# Fires when AnyConnect VPN tunnel goes down (disconnected)
#NEEDLE|Cisco Secure Client - AnyConnect VPN|2037|*[System[Provider[@Name='csc_vpnagent'] and EventID=2037]]|AnyConnect_Disconnected

# Fires on AnyConnect VPN state change (covers reconnect/roam events)
#NEEDLE|Cisco Secure Client - AnyConnect VPN|2044|*[System[Provider[@Name='csc_vpnagent'] and EventID=2044]]|AnyConnect_StateChange

# --- Network Profile ---
# Fires when Windows registers a new network connection
NEEDLE|Microsoft-Windows-NetworkProfile/Operational|10000||Network_Connected|1
NEEDLE|Microsoft-Windows-Dhcp-Client/Admin|50067||DHCP_Plummed|1

# Fires when the DHCP client renews an existing lease (counterpart to 50067).
# Extended logging on so the event body - which carries Windows' own lease
# duration details - lands in the syslog payload. Abnormally short leases
# (seconds instead of hours) show up here as a rapid renew cadence and make
# CPR re-trigger its network checks every cycle.
NEEDLE|Microsoft-Windows-Dhcp-Client/Admin|50068||DHCP_Renewed|1

# Fires when Windows loses a network connection
NEEDLE|Microsoft-Windows-NetworkProfile/Operational|10001||Network_Disconnected|1
NEEDLE|Microsoft-Windows-Dhcp-Client/Admin|50076||DHCP_Not_Plummed|1

# --- Security ---
# Fires on failed logon attempts (broad - good for blast radius awareness)
NEEDLE|Security|4625||Failed_Logon

# --- Application Crashes ---
# Fires on any application fault (broad catch - refine XPath if too noisy)
NEEDLE|Application|1000||App_Crash_Any|1

# --- Windows Power Mgmt ---
NEEDLE|System|566||MS_PowerMgmt_State_Change|all

# --- Run Header Fields (HEADER needles) ---
# Disabled by default - enable per-field or use * for the full bundle.
#HEADER|csc_version|CSC_Version|RefreshHours=6|SendHours=24
HEADER|*|Run_Header_All|RefreshHours=12|SendHours=24
