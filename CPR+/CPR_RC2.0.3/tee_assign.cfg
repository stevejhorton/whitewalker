# CPR+ Tee Assignment List
# Managed centrally on the NETLOGON share (copy this file there by hand; it is NOT installed on endpoints):
# \\ms.ds.uhc.com\netlogon\UHG\Scripts\AOVPN\CPR\tee_assign.cfg
# DO NOT edit the local cached copy. C:\ProgramData\WhiteWalker\tee_assign.cfg is auto-synced by CPR
# (read at most every 4 hours, only when the share answers).
# =============================================================================
#
# WHAT IT DOES
#   A host listed under [tee1]..[tee5] gets that tee level on its next run. The level is held with the
#   normal 14-day revert stamp, and the stamp is pushed out again (about daily) while the host stays
#   listed and the share was read successfully within the last 12 hours.
#   To end it: delete the host's line. The box stops extending and reverts by itself within 14 days.
#   A host already at or above its listed level is left alone. A level set by hand (cpr_tee_N.flag)
#   always wins. An offline box never extends.
#
# FORMAT
#   version:DDMmmYY          optional, informational (e.g. version:04Nov26). Not compared.
#   [tee1] .. [tee5]         section header = the level for the host names below it (exactly this spelling)
#   <host name>              one per line, case-insensitive, no domain suffix (the computer name)
#                            * and ? wildcards work: LAB-* matches LAB-01, LAB-LONDON-7
#   # text                   comment. Also allowed after a name, with a space before the #
#   blank lines              ignored
#   If a host matches more than one section, the HIGHEST level wins.
#   Names listed above any section header, or under an unknown section, are ignored.
#
# Check this file before publishing it:   .\diagnostics\Test-TeeAssignFile.ps1 -Path .\tee_assign.cfg
#
# =============================================================================
# Nothing below is active until you remove the leading '#'.

[tee3]
# EXAMPLE-PC-001
# LAB-*              # whole lab

[tee5]
# EXAMPLE-PC-002     # short troubleshooting, remove when done
