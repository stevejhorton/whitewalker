# =============================================================================
# HayStack LOCAL Test Needle List
# =============================================================================
# THIS FILE IS NEVER synced from the NETLOGON share.
# THIS FILE IS NEVER version-checked.
# It lives ONLY on the local machine at:
#   C:\ProgramData\WhiteWalker\needles_local.cfg
#
# PURPOSE: Personal test bed for new needles before promoting to the
#          central needles.cfg on the share.
#
# WORKFLOW:
#   1. Add a needle here to test it on THIS machine only.
#   2. Validate it does what you want in haystack.log.
#   3. When satisfied, move the entry into needles.cfg on the share.
#   4. Remove the entry from this file (or leave it - it's your box).
#
# EXPIRY (RC2.0.3): ANY line below may end with  |expires=<UTC time or date>
#   e.g.  NEEDLE|System|6006||LocalTest_CleanShutdown|1|expires=2026-11-13T03:40:00Z
#         SESSION|SessionUnlock|ProofOfLife|expires=2026-11-13      (= 00:00Z that day)
#   Once that time passes HayStack skips the line, and removes it from this file at
#   its next reroll. At most 30 days out; further than that and the line is rejected.
#   No token = never expires (the old behavior). The tech console adds it for you
#   (14 days by default), and its "Needle Bundles" option (B) writes whole canned
#   sets of needles here with an expiry already set (lines labelled bundle.<name>.*).
#   If two needles have identical LogName+EventID+XPath, the first one wins (this
#   file before needles.cfg) and the repeat is logged and skipped.
#
# FORMAT: Three line types are supported:
#
#   NEEDLE|LogName|EventID|XPathFilter|Label[|ExtendedLogging]
#
#     LogName     - Windows Event Log name
#     EventID     - Numeric Event ID to trigger on
#     XPathFilter - Full XPath <Select> expression, OR empty (trailing pipe)
#                   for a bare EventID-only match.
#     Label       - Short tag (no spaces). Must be unique across BOTH this
#                   file and needles.cfg.
#     ExtendedLogging (optional) - Set to 1 to include full event message body
#                   (truncated to 128 chars) in syslog payload as body="...".
#                   Omit or set to 0 for normal logging (metadata only).
#                   Example:
#                     NEEDLE|System|6006||LocalTest_CleanShutdown|1
#
#   SESSION|StateChange|Label
#
#     StateChange - One of: SessionLock, SessionUnlock, RemoteConnect,
#                   RemoteDisconnect, ConsoleConnect, ConsoleDisconnect
#     Label       - Short tag (no spaces). Must be unique across BOTH this
#                   file and needles.cfg.
#
#     SESSION entries generate a <SessionStateChangeTrigger> in the TS task
#     instead of an <EventTrigger>. There is no event log query on wake -
#     the action firing is itself the hit. Great for proof-of-life testing
#     (lock/unlock your workstation = instant end-to-end confirmation).
#     NOTE: SESSION triggers do not support ExtendedLogging (no message body).
#
#   DEFENDER|RuleNameMatch|IntervalHours|Label[|ExtendedLogging]
#
#     RuleNameMatch - Literal substring matched against the Name= field in each
#                     MDM firewall rule's pipe-delimited registry Data string.
#                     Matching is case-insensitive and separator-tolerant (both
#                     sides are lowercased and stripped of every non-alphanumeric
#                     character), so "V2 - MsWebView2 Any Out" still matches a
#                     deployed rule named "V2-MsWebView2 Any Out". Never a regex.
#                     Pick a distinctive, stable, descriptive substring - very
#                     short/generic values can collide with unrelated rules.
#     IntervalHours - Optional numeric re-check interval. Empty/invalid uses
#                     the global default of 6 hours.
#     Label         - Short tag (no spaces or \/:*?"<>|). Must be unique across
#                     BOTH this file and needles.cfg.
#     ExtendedLogging (optional) - 0/empty omits body; 1 includes the first
#                     128 characters; 2/all includes the full matched rule Data.
#     DEFENDER entries run inline when due and do not create TS triggers.
#
#   HEADER|FieldName|Label[|RefreshHours=N][|SendHours=M]
#
#     FieldName   - One known run-header field (ww_version, os, model, serial,
#                   last_boot, csc_version, csc_source, vpn_profile) or * for
#                   all of them bundled into a single payload under this Label.
#                   An unknown name is skipped with a WARN in haystack.log.
#     Label       - Short tag (no spaces or \/:*?"<>|). Must be unique across
#                   BOTH this file and needles.cfg.
#     RefreshHours=N - Optional. How often Write-RunHeader recomputes the value
#                   in header_cache.json. Default 6.
#     SendHours=M - Optional. How often the cached value is shipped to
#                   HayStack/Tee/syslog. Default 24.
#     HEADER entries run inline when due and do not create TS triggers.
#
# File absence = silent skip. CPR will not error if this file does not exist.
# Labels MUST be unique across BOTH this file and needles.cfg.
# =============================================================================
#
# --- EXAMPLES (uncomment to activate) ---
#
# NEEDLE examples:
#
# Fires on clean shutdown (good for testing the pipeline end-to-end)
NEEDLE|System|6006||LocalTest_CleanShutdown|1
#
# Fires on unexpected shutdown / blue screen (with extended logging to see error details)
NEEDLE|System|6008||LocalTest_DirtyShutdown|1
#
# SESSION examples:
#
# Fires on workstation unlock - instant proof-of-life for HayStack end-to-end
# Lock or Unlock your screen (Win+L), unlock it, check haystack.log for NEEDLE_HIT
SESSION|SessionUnlock|Workstation_Unlock
#SESSION|SessionLock|Workstation_Lock
#
# DEFENDER example:
# DEFENDER|V2 - MsWebView2 Any Out|6|WebView2_FW_Allow|all #migrated to global
#
# HEADER examples:
#HEADER|csc_version|LocalTest_CSC_Version|RefreshHours=6|SendHours=24
#HEADER|*|LocalTest_Run_Header_All|RefreshHours=12|SendHours=24
#
# Add your test needles below this line:
