# =============================================================================
# Needle bundle catalog (master list)
# Managed centrally next to needles.cfg on the NETLOGON share (bundles\ subfolder);
# a copy ships in the CPR package and is the offline fallback.
# Applied from the tech console (Invoke-WhiteWalkerAction.ps1, option B).
# =============================================================================
#
# A bundle is a named set of ordinary needle lines. Nothing here is active until a
# tech applies a bundle on a box. Applying copies the lines into that box's
# needles_local.cfg, each label prefixed bundle.<name>. and each line stamped
# |expires=<UTC time> (default_days, max 30). Applying the same bundle again
# replaces its lines and restarts the clock. Removing a bundle deletes its lines.
# Overlap with needles.cfg or another bundle is harmless: HayStack keeps the first
# needle with identical LogName+EventID+XPath (local first) and logs the skip.
#
# FORMAT
#   [bundle:<name>]          name = lowercase letters, digits, underscore
#   description=<one line>   required
#   default_days=<1-30>      optional, default 14
#   volume=<low|medium|high> optional, default low - shown to the tech before applying
#   <needle lines>           NEEDLE| SESSION| DEFENDER| HEADER| (same syntax as
#                            needles.cfg). Do NOT put |expires= on them - the tool does.
#
# Every line is parsed by the real needle parser in the Pester suite
# (tests\CPR_RC2.NeedleBundles.Tests.ps1), so a typo fails the build, not a box.
#
# XPath: when the XPathFilter field is filled it becomes the WHOLE <Select> body, so it
# must contain the EventID test itself (see power_resume below). Leave it empty for a
# plain EventID match.
#
# NOTE: the validator proves the syntax is valid, not that the event actually fires.
# Check each new event ID on a real box (Event Viewer) before relying on it.
# =============================================================================

[bundle:network_flap]
description=Network bouncing: Wi-Fi association, network profile up/down, DHCP, DNS timeouts
default_days=14
volume=medium
NEEDLE|Microsoft-Windows-WLAN-AutoConfig/Operational|8001||wlan_connected|1
NEEDLE|Microsoft-Windows-WLAN-AutoConfig/Operational|8002||wlan_connect_failed|1
NEEDLE|Microsoft-Windows-WLAN-AutoConfig/Operational|8003||wlan_disconnected|1
NEEDLE|Microsoft-Windows-NetworkProfile/Operational|10000||net_connected|1
NEEDLE|Microsoft-Windows-NetworkProfile/Operational|10001||net_disconnected|1
NEEDLE|Microsoft-Windows-Dhcp-Client/Admin|50067||dhcp_plummed|1
NEEDLE|Microsoft-Windows-Dhcp-Client/Admin|50068||dhcp_renewed|1
NEEDLE|Microsoft-Windows-Dhcp-Client/Admin|50076||dhcp_not_plummed|1
NEEDLE|Microsoft-Windows-DNS-Client/Operational|1014||dns_timeout|1

[bundle:power_resume]
description=Sleep/wake and unexpected reboot, for "it broke after I opened the lid" tickets
default_days=14
volume=low
NEEDLE|System|1|*[System[Provider[@Name='Microsoft-Windows-Power-Troubleshooter'] and EventID=1]]|wake_from_sleep|1
NEEDLE|System|41|*[System[Provider[@Name='Microsoft-Windows-Kernel-Power'] and EventID=41]]|unexpected_reboot|1
NEEDLE|System|107|*[System[Provider[@Name='Microsoft-Windows-Kernel-Power'] and EventID=107]]|resume_from_sleep|1
NEEDLE|System|566||power_state_change|all

[bundle:app_crashes]
description=Application crashes and hangs (any application)
default_days=14
volume=medium
NEEDLE|Application|1000||app_crash|1
NEEDLE|Application|1002||app_hang|1
